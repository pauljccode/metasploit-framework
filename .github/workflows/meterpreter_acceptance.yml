name: Mettle package evidence and acceptance

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full Mettle contribution commit SHA
        type: string
        required: true

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rapid7/mettle
          ref: ${{ inputs.source_commit }}
      - name: Verify source commit
        env:
          EXPECTED_SHA: ${{ inputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

  build:
    needs: provenance
    uses: ./.github/workflows/shared_meterpreter_acceptance.yml
    with:
      metasploit_framework_commit: 75193f4c81e2255f39054b36749dd8bc69282d15
      build_mettle: true
      mettle_commit: ${{ inputs.source_commit }}
