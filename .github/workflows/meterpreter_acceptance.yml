name: Mettle natural notification diagnostics

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Pinned baseline source for matched diagnostics
        default: 4dd76aed028fff0a214564cb4c389947b71a194b
        type: string
        required: true

      diagnostic_os:
        description: Runner for the matched experiment
        type: choice
        options:
          - ubuntu-latest
          - macos-15-intel
        default: ubuntu-latest
        required: true
      diagnostic_seed:
        description: RSpec seed from the failing job
        type: string
        default: '16218'
        required: true

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rapid7/mettle
          ref: ${{ inputs.source_commit }}
      - name: Verify source commit
        env:
          EXPECTED_SHA: ${{ inputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

  build:
    needs: provenance
    uses: ./.github/workflows/shared_meterpreter_acceptance.yml
    with:
      metasploit_framework_commit: 75193f4c81e2255f39054b36749dd8bc69282d15
      build_mettle: true
      diagnostic_os: ${{ inputs.diagnostic_os }}
      diagnostic_seed: ${{ inputs.diagnostic_seed }}
      mettle_commit: ${{ inputs.source_commit }}
