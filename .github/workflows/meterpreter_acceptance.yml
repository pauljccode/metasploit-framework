name: Pinned contribution acceptance

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to build from source
        type: choice
        options:
          - payloads
          - mettle
        required: true
      source_commit:
        description: Full contribution commit SHA
        type: string
        required: true

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.component == 'mettle' && 'rapid7/mettle' || 'rapid7/metasploit-payloads' }}
          ref: ${{ inputs.source_commit }}
      - name: Verify source commit
        env:
          EXPECTED_SHA: ${{ inputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

  build:
    needs: provenance
    uses: rapid7/metasploit-framework/.github/workflows/shared_meterpreter_acceptance.yml@75193f4c81e2255f39054b36749dd8bc69282d15
    with:
      metasploit_framework_commit: 75193f4c81e2255f39054b36749dd8bc69282d15
      build_mettle: ${{ inputs.component == 'mettle' }}
      build_metasploit_payloads: ${{ inputs.component == 'payloads' }}
      mettle_commit: ${{ inputs.component == 'mettle' && inputs.source_commit || '' }}
      metasploit_payloads_commit: ${{ inputs.component == 'payloads' && inputs.source_commit || '' }}
