name: Windows console startup diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cache: ['5', '6-java-8']
    env:
      RAILS_ENV: test
      BUNDLE_WITHOUT: coverage development
      NOKOGIRI_USE_MIRRORED_GNU_SOURCE: t
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostic-tools
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install system dependencies (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # pcap dependencies
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri 'https://www.winpcap.org/install/bin/WpdPack_4_1_2.zip' -OutFile 'C:\Windows\Temp\WpdPack_4_1_2.zip' -SkipCertificateCheck
          $expected = 'ea799cf2f26e4afb1892938070fd2b1ca37ce5cf75fec4349247df12b784edbd'
          $actual = (Get-FileHash 'C:\Windows\Temp\WpdPack_4_1_2.zip' -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "WpdPack_4_1_2.zip SHA256 mismatch: expected $expected, got $actual" }

          choco install 7zip -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install 7zip failed with exit code $LASTEXITCODE" }

          7z x "C:\Windows\Temp\WpdPack_4_1_2.zip" -o"C:\"
          if ($LASTEXITCODE -ne 0) { throw "7z extraction failed with exit code $LASTEXITCODE" }

      - name: Checkout the source from the failed job
        uses: actions/checkout@v4
        with:
          repository: rapid7/metasploit-framework
          ref: a6e8091aae76b91302704cb27050113ede98aa2d
          path: metasploit-framework
      - name: Complete Git maintenance before Bundler
        run: git config --global maintenance.autoDetach false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '3.4.11'
          bundler-cache: true
          cache-version: ${{ matrix.cache }}
          working-directory: metasploit-framework
      - name: Check diagnostic process handling on Windows
        run: bundle exec ruby ../diagnostic-tools/.github/diagnostics/test_console_startup_probe.rb
        working-directory: metasploit-framework
      - name: Observe three console starts
        run: bundle exec ruby ../diagnostic-tools/.github/diagnostics/probe_console_startup.rb ../startup-results
        working-directory: metasploit-framework
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-startup-cache-${{ matrix.cache }}
          path: startup-results
