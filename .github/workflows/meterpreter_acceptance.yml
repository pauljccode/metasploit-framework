name: Windows gem platform diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform-selection:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '3.4'
          bundler: '2.5.22'
          bundler-cache: false
      - name: Check native gem selection before and after update
        run: ruby .github/diagnostics/windows_gem_platform.rb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-gem-platform-evidence
          path: .github/diagnostics/bundler-platform-*/
          if-no-files-found: error
