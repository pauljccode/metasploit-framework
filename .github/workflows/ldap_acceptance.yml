name: LDAP transport diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compare archive transport and container trust
        run: bash test/ldap/transport-probe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ldap-transport-evidence
          path: transport-evidence/
          if-no-files-found: error
